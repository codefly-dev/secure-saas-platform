apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-starter-web
  namespace: workloads
  labels:
    app.kubernetes.io/name: saas-starter-web
    app.kubernetes.io/part-of: saas-starter
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-starter-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-starter-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: ghcr.io/codefly-dev/saas-starter-web@sha256:3f7a1c9b0d2e4f60718293a4b5c6d7e8f90112233445566778899aabbccddeeff
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
