apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: deny-application-service-account-tokens
  annotations:
    policies.kyverno.io/category: Identity and Access
    policies.kyverno.io/subject: Pod,ServiceAccount
spec:
  validationFailureAction: Enforce
  background: true
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 10
  rules:
    - name: serviceaccount-automount-must-be-false
      match:
        any:
          - resources:
              kinds:
                - ServiceAccount
              namespaceSelector:
                matchLabels:
                  security.deus.dev/service-account-token-policy: restricted
      validate:
        message: SEC_TOKEN_AUTOMOUNT_DENIED ServiceAccounts in application namespaces must disable token automount.
        pattern:
          automountServiceAccountToken: false
    - name: pod-automount-must-be-false
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  security.deus.dev/service-account-token-policy: restricted
      validate:
        message: SEC_TOKEN_AUTOMOUNT_DENIED Pods in application namespaces must disable token automount.
        pattern:
          spec:
            automountServiceAccountToken: false
    - name: kubernetes-api-token-projection-forbidden
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  security.deus.dev/service-account-token-policy: restricted
      validate:
        message: SEC_TOKEN_PROJECTION_DENIED Kubernetes API ServiceAccount token projections are forbidden.
        foreach:
          - list: "request.object.spec.volumes[].projected.sources[].serviceAccountToken || `[]`"
            preconditions:
              all:
                - key: "{{ element.audience || '' }}"
                  operator: NotEquals
                  value: pods.eks.amazonaws.com
            deny:
              conditions:
                any:
                  - key: "{{ element.audience || '' }}"
                    operator: In
                    value:
                      - ""
                      - https://kubernetes.default.svc
                      - https://kubernetes.default.svc.cluster.local
    - name: projected-cloud-token-must-match-infrastructure-owned-identity
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  security.deus.dev/service-account-token-policy: restricted
      context:
        - name: workloadServiceAccount
          apiCall:
            urlPath: "/api/v1/namespaces/{{ request.namespace }}/serviceaccounts/{{ request.object.spec.serviceAccountName || 'default' }}"
      preconditions:
        all:
          - key: "{{ length(request.object.spec.volumes[].projected.sources[].serviceAccountToken || `[]`) }}"
            operator: GreaterThan
            value: 0
      validate:
        message: SEC_CLOUD_TOKEN_BINDING_DENIED Projected cloud identity tokens must exactly match an infrastructure-owned ServiceAccount binding and bounded lifetime.
        foreach:
          - list: "request.object.spec.volumes[].projected.sources[].serviceAccountToken || `[]`"
            preconditions:
              all:
                - key: "{{ element.audience || '' }}"
                  operator: NotIn
                  value:
                    - ""
                    - https://kubernetes.default.svc
                    - https://kubernetes.default.svc.cluster.local
                    - pods.eks.amazonaws.com
            deny:
              conditions:
                any:
                  - key: '{{ request.object.metadata.annotations."security.deus.dev/workload-identity-binding-digest" || '''' }}'
                    operator: NotEquals
                    value: '{{ workloadServiceAccount.metadata.annotations."security.deus.dev/workload-identity-binding-digest" || '''' }}'
                  - key: '{{ request.object.metadata.annotations."security.deus.dev/workload-identity-audience" || '''' }}'
                    operator: NotEquals
                    value: '{{ workloadServiceAccount.metadata.annotations."security.deus.dev/workload-identity-audience" || '''' }}'
                  - key: "{{ element.audience || '' }}"
                    operator: NotEquals
                    value: '{{ workloadServiceAccount.metadata.annotations."security.deus.dev/workload-identity-audience" || '''' }}'
                  - key: "{{ element.expirationSeconds || `0` }}"
                    operator: LessThan
                    value: 600
                  - key: "{{ element.expirationSeconds || `0` }}"
                    operator: GreaterThan
                    value: 3600
                  - key: "{{ element.path || '' }}"
                    operator: NotEquals
                    value: token
    - name: eks-pod-identity-token-must-match-association
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  security.deus.dev/service-account-token-policy: restricted
      context:
        - name: workloadServiceAccount
          apiCall:
            urlPath: "/api/v1/namespaces/{{ request.namespace }}/serviceaccounts/{{ request.object.spec.serviceAccountName || 'default' }}"
      preconditions:
        all:
          - key: "{{ length(request.object.spec.volumes[].projected.sources[].serviceAccountToken || `[]`) }}"
            operator: GreaterThan
            value: 0
      validate:
        message: SEC_EKS_POD_IDENTITY_DENIED EKS Pod Identity tokens must exactly match an infrastructure-owned association, binding digest, audience, path, and provider lifetime.
        foreach:
          - list: "request.object.spec.volumes[].projected.sources[].serviceAccountToken || `[]`"
            preconditions:
              all:
                - key: "{{ element.audience || '' }}"
                  operator: Equals
                  value: pods.eks.amazonaws.com
            deny:
              conditions:
                any:
                  - key: '{{ workloadServiceAccount.metadata.annotations."security.deus.dev/workload-identity-mode" || '''' }}'
                    operator: NotEquals
                    value: eks-pod-identity
                  - key: '{{ request.object.metadata.annotations."security.deus.dev/workload-identity-binding-digest" || '''' }}'
                    operator: NotEquals
                    value: '{{ workloadServiceAccount.metadata.annotations."security.deus.dev/workload-identity-binding-digest" || '''' }}'
                  - key: '{{ request.object.metadata.annotations."security.deus.dev/workload-identity-audience" || '''' }}'
                    operator: NotEquals
                    value: pods.eks.amazonaws.com
                  - key: '{{ workloadServiceAccount.metadata.annotations."security.deus.dev/workload-identity-audience" || '''' }}'
                    operator: NotEquals
                    value: pods.eks.amazonaws.com
                  - key: "{{ element.expirationSeconds || `0` }}"
                    operator: NotEquals
                    value: 86400
                  - key: "{{ element.path || '' }}"
                    operator: NotEquals
                    value: eks-pod-identity-token
    - name: secret-volumes-forbidden
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  security.deus.dev/service-account-token-policy: restricted
      validate:
        message: SEC_SECRET_VOLUME_DENIED Secret volumes, including legacy ServiceAccount token Secrets, are forbidden in reference-only application namespaces.
        deny:
          conditions:
            any:
              - key: "{{ length(request.object.spec.volumes[].secret || `[]`) }}"
                operator: GreaterThan
                value: 0
