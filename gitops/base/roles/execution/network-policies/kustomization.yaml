apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../network-policies
patches:
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: platform-only
        namespace: platform-only
    target:
      kind: NetworkPolicy
      namespace: (agent-broker|agent-egress|platform|workloads)
