apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../namespaces
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: platform-only
    target:
      kind: Namespace
      name: (agent-broker|agent-egress|argo-rollouts|cert-manager|external-dns|istio-ingress|platform|tailscale|vault|workloads)
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: default
        namespace: platform-only
    target:
      kind: ServiceAccount
      name: default
      namespace: (agent-broker|agent-egress|platform|workloads)
