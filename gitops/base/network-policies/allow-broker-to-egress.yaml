apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-broker-to-egress
  namespace: agent-broker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: broker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-egress
          podSelector:
            matchLabels:
              app.kubernetes.io/component: model-gateway
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-agent-broker
  namespace: agent-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: model-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-broker
          podSelector:
            matchLabels:
              app.kubernetes.io/component: broker
      ports:
        - protocol: TCP
          port: 8443
