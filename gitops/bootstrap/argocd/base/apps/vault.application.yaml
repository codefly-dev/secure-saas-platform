apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: security
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.31.0
    helm:
      releaseName: vault
      values: |
        global:
          enabled: true
          tlsDisable: false
        server:
          enabled: true
          ha:
            enabled: true
            replicas: 3
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui = true

                listener "tcp" {
                  tls_disable = false
                  address     = "[::]:8200"
                  cluster_address = "[::]:8201"
                  tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
                  tls_key_file = "/vault/userconfig/vault-tls/tls.key"
                  tls_min_version = "tls13"
                }

                storage "raft" {
                  path = "/vault/data"
                }

                seal "awskms" {
                  region     = "us-east-1"
                  kms_key_id = "alias/deus-shared-services-vault-auto-unseal"
                }

                service_registration "kubernetes" {}
          dataStorage:
            enabled: true
            size: 50Gi
            storageClass: gp3
          auditStorage:
            enabled: true
            size: 25Gi
            storageClass: gp3
          extraEnvironmentVars:
            VAULT_LOG_LEVEL: info
            VAULT_LOG_FORMAT: json
          standalone:
            enabled: false
          serviceAccount:
            create: true
            name: vault
        ui:
          enabled: true
          serviceType: ClusterIP
          publishNotReadyAddresses: false
        injector:
          enabled: false
        csi:
          enabled: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
