apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-infrastructure-handoff
  namespace: argocd-database
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    security.deus.dev/authority: infrastructure-controller
spec:
  project: database-infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: codefly-db-runtime-warden-saas-postgres-development
  source:
    repoURL: https://github.com/codefly-dev/secure-saas-infra.git
    path: gitops/generated/database/development
    targetRevision: 17c2aab74a2dadab146d2d63d4e1fa97e057c922
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
      - PruneLast=true
      - ServerSideApply=true
