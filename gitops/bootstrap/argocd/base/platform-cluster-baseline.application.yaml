apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cluster-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  source:
    repoURL: https://github.com/your-org/secure-saas-infra.git
    targetRevision: main
    path: gitops/overlays/dev/platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
