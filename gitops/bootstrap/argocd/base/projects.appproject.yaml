apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: Deny-all default project; every Application must select an owned project.
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: IaC-owned cluster security and namespace baselines.
  sourceRepos:
    - https://github.com/codefly-dev/secure-saas-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: agent-broker
    - server: https://kubernetes.default.svc
      namespace: agent-egress
    - server: https://kubernetes.default.svc
      namespace: platform
    - server: https://kubernetes.default.svc
      namespace: execution
    - server: https://kubernetes.default.svc
      namespace: istio-system
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: security
    - server: https://kubernetes.default.svc
      namespace: tailscale
    - server: https://kubernetes.default.svc
      namespace: workloads
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: kyverno.io
      kind: ClusterPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: node.k8s.io
      kind: RuntimeClass
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ResourceQuota
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: security.istio.io
      kind: AuthorizationPolicy
    - group: security.istio.io
      kind: PeerAuthentication
    - group: tailscale.com
      kind: Connector
    - group: telemetry.istio.io
      kind: Telemetry
  roles:
    - name: bootstrap-sync
      description: Sync only the two IaC-owned cluster baseline Applications.
      groups:
        - deus:infra:bootstrap
      policies:
        - p, proj:bootstrap:bootstrap-sync, applications, get, bootstrap/platform-cluster-baseline, allow
        - p, proj:bootstrap:bootstrap-sync, applications, sync, bootstrap/platform-cluster-baseline, allow
        - p, proj:bootstrap:bootstrap-sync, applications, get, bootstrap/execution-cluster-baseline, allow
        - p, proj:bootstrap:bootstrap-sync, applications, sync, bootstrap/execution-cluster-baseline, allow
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-operators
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: Pinned platform operators with explicit repositories and namespaces.
  sourceRepos:
    - https://argoproj.github.io/argo-helm
    - https://charts.jetstack.io
    - https://github.com/kubernetes-sigs/gateway-api.git
    - https://istio-release.storage.googleapis.com/charts
    - https://kubernetes-sigs.github.io/external-dns/
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://pkgs.tailscale.com/helmcharts
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: default
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: istio-ingress
    - server: https://kubernetes.default.svc
      namespace: istio-system
    - server: https://kubernetes.default.svc
      namespace: metrics-server
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: tailscale
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiregistration.k8s.io
      kind: APIService
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Endpoints
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: DaemonSet
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: batch
      kind: CronJob
    - group: batch
      kind: Job
    - group: monitoring.coreos.com
      kind: Alertmanager
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  roles:
    - name: operator-sync
      description: Read and sync only the named platform operator Applications.
      groups:
        - deus:infra:platform-operators
      policies:
        - p, proj:platform-operators:operator-sync, applications, get, platform-operators/argo-rollouts, allow
        - p, proj:platform-operators:operator-sync, applications, sync, platform-operators/argo-rollouts, allow
        - p, proj:platform-operators:operator-sync, applications, get, platform-operators/cert-manager, allow
        - p, proj:platform-operators:operator-sync, applications, sync, platform-operators/cert-manager, allow
        - p, proj:platform-operators:operator-sync, applications, get, platform-operators/external-dns, allow
        - p, proj:platform-operators:operator-sync, applications, sync, platform-operators/external-dns, allow
        - p, proj:platform-operators:operator-sync, applications, get, platform-operators/gateway-api-crds, allow
        - p, proj:platform-operators:operator-sync, applications, sync, platform-operators/gateway-api-crds, allow
        - p, proj:platform-operators:operator-sync, applications, get, platform-operators/istio-base, allow
        - p, proj:platform-operators:operator-sync, applications, sync, platform-operators/istio-base, allow
        - p, proj:platform-operators:operator-sync, applications, get, platform-operators/istio-cni, allow
        - p, proj:platform-operators:operator-sync, applications, sync, platform-operators/istio-cni, allow
        - p, proj:platform-operators:operator-sync, applications, get, platform-operators/istio-ingress-gateway, allow
        - p, proj:platform-operators:operator-sync, applications, sync, platform-operators/istio-ingress-gateway, allow
        - p, proj:platform-operators:operator-sync, applications, get, platform-operators/istio-ztunnel, allow
        - p, proj:platform-operators:operator-sync, applications, sync, platform-operators/istio-ztunnel, allow
        - p, proj:platform-operators:operator-sync, applications, get, platform-operators/istiod, allow
        - p, proj:platform-operators:operator-sync, applications, sync, platform-operators/istiod, allow
        - p, proj:platform-operators:operator-sync, applications, get, platform-operators/kube-prometheus-stack, allow
        - p, proj:platform-operators:operator-sync, applications, sync, platform-operators/kube-prometheus-stack, allow
        - p, proj:platform-operators:operator-sync, applications, get, platform-operators/metrics-server, allow
        - p, proj:platform-operators:operator-sync, applications, sync, platform-operators/metrics-server, allow
        - p, proj:platform-operators:operator-sync, applications, get, platform-operators/tailscale-operator, allow
        - p, proj:platform-operators:operator-sync, applications, sync, platform-operators/tailscale-operator, allow
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
