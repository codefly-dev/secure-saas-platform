    - https://helm.releases.hashicorp.com
    - https://kyverno.github.io/kyverno/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: falco
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: vault
    - server: https://kubernetes.default.svc
      namespace: vault-secrets-operator
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: DaemonSet
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: CronJob
    - group: batch
      kind: Job
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  roles:
    - name: security-sync
      description: Read and sync only the named security Applications.
      groups:
        - deus:infra:security
      policies:
        - p, proj:security:security-sync, applications, get, security/external-secrets, allow
        - p, proj:security:security-sync, applications, sync, security/external-secrets, allow
        - p, proj:security:security-sync, applications, get, security/falco, allow
        - p, proj:security:security-sync, applications, sync, security/falco, allow
        - p, proj:security:security-sync, applications, get, security/kyverno, allow
        - p, proj:security:security-sync, applications, sync, security/kyverno, allow
        - p, proj:security:security-sync, applications, get, security/vault, allow
        - p, proj:security:security-sync, applications, sync, security/vault, allow
        - p, proj:security:security-sync, applications, get, security/vault-secrets-operator, allow
        - p, proj:security:security-sync, applications, sync, security/vault-secrets-operator, allow
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: database-infrastructure
  namespace: argocd-database
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: Digest-bound database access bundles; never application delivery.
  sourceRepos:
    - https://github.com/codefly-dev/secure-saas-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: codefly-db-runtime-warden-saas-postgres-development
    - server: https://kubernetes.default.svc
      namespace: codefly-db-migration-warden-saas-postgres-development
    - server: https://kubernetes.default.svc
      namespace: codefly-db-bootstrap-warden-saas-postgres-development
    - server: https://kubernetes.default.svc
      namespace: codefly-db-runtime-mind-users-postgres-development
    - server: https://kubernetes.default.svc
      namespace: codefly-db-migration-mind-users-postgres-development
    - server: https://kubernetes.default.svc
      namespace: codefly-db-bootstrap-mind-users-postgres-development
    - server: https://kubernetes.default.svc
      namespace: codefly-db-runtime-mind-infra-postgres-development
    - server: https://kubernetes.default.svc
      namespace: codefly-db-migration-mind-infra-postgres-development
    - server: https://kubernetes.default.svc
      namespace: codefly-db-bootstrap-mind-infra-postgres-development
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: eks.amazonaws.com
      kind: NodeClass
    - group: karpenter.sh
      kind: NodePool
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: networking.k8s.aws
      kind: ApplicationNetworkPolicy
  roles:
    - name: database-infrastructure-sync
      description: Sync only the controller-owned database handoff Application.
      groups:
        - deus:infra:database
      policies:
        - p, proj:database-infrastructure:database-infrastructure-sync, applications, get, database-infrastructure/database-infrastructure-handoff, allow
        - p, proj:database-infrastructure:database-infrastructure-sync, applications, sync, database-infrastructure/database-infrastructure-handoff, allow
---
