apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base
patches:
  - path: platform-application-patch.yaml
    target:
      kind: Application
      name: platform-cluster-baseline
  - patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: execution-cluster-baseline
    target:
      kind: Application
      name: execution-cluster-baseline
