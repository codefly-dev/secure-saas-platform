apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base
patches:
  - path: platform-application-patch.yaml
    target:
      kind: Application
      name: platform-cluster-baseline
  - path: database-infrastructure-project-patch.yaml
    target:
      kind: AppProject
      name: database-infrastructure
  - path: database-infrastructure-application-patch.yaml
    target:
      kind: Application
      name: database-infrastructure-handoff
  - patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: execution-cluster-baseline
    target:
      kind: Application
      name: execution-cluster-baseline
