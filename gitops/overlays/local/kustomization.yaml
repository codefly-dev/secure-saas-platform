apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The local cluster deliberately reuses only provider-neutral bases. EKS
  # APIs, cloud load balancers, Route 53, KMS/gp3 Vault, Falco host behavior,
  # Tailscale identity, and the unavailable microVM runtime remain covered by
  # their AWS or dedicated disposable-cluster gates.
  - ../../base/namespaces
  - ../../base/network-policies
  - ../../base/quotas
patches:
  - path: platform-namespace-labels.yaml
  - path: execution-namespace-labels.yaml
